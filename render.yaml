services:
  - type: web
    name: hht-catalog
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: hht-catalog-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ORIGINS
        value: "*"
      - key: LOCAL_UPLOAD_DIR
        value: /data/uploads
      - key: SAVE_UPLOADS
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
        sync: false
