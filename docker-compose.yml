version: "3.9"

services:
  hht-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hht-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=production
      # Optional: set these for real AI vision
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - GEMINI_MODEL=gemini-1.5-flash
      # - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      # - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      # - AZURE_OPENAI_DEPLOYMENT=gpt-4o
      # Optional: set for inventory persistence with Appwrite
      # - APPWRITE_ENDPOINT=https://cloud.appwrite.io/v1
      # - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      # - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      # - APPWRITE_DATABASE_ID=default
      # - APPWRITE_COLLECTION_ID=inventory
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Vision cron job runner (Dockerfile.vision)
