services:
  hht-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hht-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CORS_ORIGINS: "http://localhost:5173"
      LOCAL_UPLOAD_DIR: "/data/uploads"
      SAVE_UPLOADS: "true"
      MAX_UPLOAD_MB: "10"
      DATABASE_URL: "${DATABASE_URL:-}"
      COMMERCE_AGENT_DB: "${COMMERCE_AGENT_DB:-/data/commerce_agent.sqlite3}"
      EBAY_CLIENT_ID: "${EBAY_CLIENT_ID:-}"
      EBAY_CLIENT_SECRET: "${EBAY_CLIENT_SECRET:-}"
      EBAY_REFRESH_TOKEN: "${EBAY_REFRESH_TOKEN:-}"
      EBAY_TAXONOMY_ENABLED: "${EBAY_TAXONOMY_ENABLED:-false}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NVIDIA_NIM_BASE_URL: "${NVIDIA_NIM_BASE_URL:-}"
      NVIDIA_NIM_API_KEY: "${NVIDIA_NIM_API_KEY:-}"
      NVIDIA_CATEGORY_MODEL: "${NVIDIA_CATEGORY_MODEL:-}"
    volumes:
      - hht_app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hht-frontend:
    image: node:20-alpine
    container_name: hht-frontend
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_PUBLIC_API_URL: "http://localhost:8080"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      hht-api:
        condition: service_healthy
    restart: unless-stopped

  hht-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hht-worker
    command: python worker.py
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      COMMERCE_AGENT_DB: "${COMMERCE_AGENT_DB:-/data/commerce_agent.sqlite3}"
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-10}"
      EBAY_TAXONOMY_ENABLED: "${EBAY_TAXONOMY_ENABLED:-false}"
      EBAY_CLIENT_ID: "${EBAY_CLIENT_ID:-}"
      EBAY_CLIENT_SECRET: "${EBAY_CLIENT_SECRET:-}"
      EBAY_REFRESH_TOKEN: "${EBAY_REFRESH_TOKEN:-}"
      EBAY_MARKETPLACE_ID: "${EBAY_MARKETPLACE_ID:-EBAY_US}"
      EBAY_ENVIRONMENT: "${EBAY_ENVIRONMENT:-production}"
      NVIDIA_NIM_BASE_URL: "${NVIDIA_NIM_BASE_URL:-}"
      NVIDIA_NIM_API_KEY: "${NVIDIA_NIM_API_KEY:-}"
      NVIDIA_CATEGORY_MODEL: "${NVIDIA_CATEGORY_MODEL:-}"
    volumes:
      - hht_app_data:/data
    depends_on:
      hht-api:
        condition: service_healthy
    restart: unless-stopped

  hht-nvidia:
    profiles: ["nvidia"]
    image: nvcr.io/nvidia/pytorch:24.10-py3
    command: python -c "print('Optional NVIDIA worker placeholder; configure NIM endpoint before enabling.')"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hht_app_data:
  frontend_node_modules:
