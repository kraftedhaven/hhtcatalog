name: HHT CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node for Flask frontend smoke checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for backend smoke coverage
        working-directory: frontend
        run: npm ci && npm run build
      - name: Apply PostgreSQL migrations
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying migration: $f"
            psql "$TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run backend tests (SQLite + PostgreSQL + concurrency)
        env:
          DEMO_MODE: 'true'
          EBAY_MUTATIONS_ENABLED: 'false'
          EBAY_DRAFTS_ENABLED: 'false'
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          python - <<'PY'
          import sys, unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(
              f"CI_BACKEND_SUMMARY ran={result.testsRun} "
              f"failures={len(result.failures)} errors={len(result.errors)} "
              f"skipped={len(result.skipped)}"
          )
          for test_case, reason in result.skipped:
              print(f"SKIPPED: {test_case.id()} :: {reason}")
          if result.skipped:
              print("ERROR: Expected 0 skipped tests when TEST_POSTGRES_URL is configured.", file=sys.stderr)
              sys.exit(1)
          if not result.wasSuccessful():
              sys.exit(1)
          PY
      - name: Run dedicated PostgreSQL and concurrency verification suite
        env:
          DEMO_MODE: 'true'
          EBAY_MUTATIONS_ENABLED: 'false'
          EBAY_DRAFTS_ENABLED: 'false'
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          python - <<'PY'
          import sys, unittest

          targets = [
              "tests.test_inventory_workspace.InventoryWorkspaceTests.test_postgres_integrity_schema_is_present_read_only",
              "tests.test_inventory_workspace.InventoryWorkspaceTests.test_concurrent_submission_claim_allows_only_one_external_call",
              "tests.test_integrity_release_blockers.IntegrityReleaseBlockersTests.test_disposable_postgresql_grouping_moves_merges_invalidation_and_csv_export",
              "tests.test_integrity_release_blockers.IntegrityReleaseBlockersTests.test_disposable_postgresql_concurrent_claims_and_ambiguous_submission",
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(targets)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(
              f"CI_PG_CONCURRENCY_SUMMARY ran={result.testsRun} "
              f"failures={len(result.failures)} errors={len(result.errors)} "
              f"skipped={len(result.skipped)}"
          )
          if result.testsRun != len(targets) or result.skipped or not result.wasSuccessful():
              sys.exit(1)
          PY

  frontend-tests-and-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  deployment-smoke:
    name: Pre-deployment smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests-and-build]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node for frontend entrypoint smoke check
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for smoke test
        working-directory: frontend
        run: npm ci && npm run build
      - name: Run safe smoke test
        env:
          DEMO_MODE: 'true'
          EBAY_MUTATIONS_ENABLED: 'false'
          EBAY_DRAFTS_ENABLED: 'false'
        run: python -m unittest tests.test_deployment_smoke
      - name: Build and verify production Docker image
        run: |
          docker build -t hhtcatalog:ci .
          cleanup() {
            docker rm -f hht-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name hht-smoke -p 18080:8080 \
            -e DEMO_MODE=true \
            -e EBAY_MUTATIONS_ENABLED=false \
            -e EBAY_DRAFTS_ENABLED=false \
            hhtcatalog:ci
          python - <<'PY'
          import json, time, urllib.request

          last_err = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18080/health", timeout=3) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                      assert resp.status == 200 and body.get("status") == "ok", body
                  with urllib.request.urlopen("http://127.0.0.1:18080/", timeout=3) as resp:
                      html = resp.read().decode("utf-8")
                      assert resp.status == 200 and "<html" in html.lower(), html[:200]
                  print("DOCKER_PRODUCTION_SMOKE_OK")
                  break
              except Exception as exc:
                  last_err = exc
                  time.sleep(1)
          else:
              raise RuntimeError(f"Docker smoke failed: {last_err}")
          PY
