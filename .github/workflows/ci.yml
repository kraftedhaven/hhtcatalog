name: HHT CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node for Flask frontend smoke checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for backend smoke coverage
        working-directory: frontend
        run: npm ci && npm run build
      - name: Run backend tests
        env:
          DEMO_MODE: 'true'
          EBAY_MUTATIONS_ENABLED: 'false'
          EBAY_DRAFTS_ENABLED: 'false'
        run: python -m unittest discover -s tests -p 'test_*.py'

  frontend-tests-and-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  deployment-smoke:
    name: Pre-deployment smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests-and-build]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node for frontend entrypoint smoke check
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for smoke test
        working-directory: frontend
        run: npm ci && npm run build
      - name: Run safe smoke test
        env:
          DEMO_MODE: 'true'
          EBAY_MUTATIONS_ENABLED: 'false'
          EBAY_DRAFTS_ENABLED: 'false'
        run: python -m unittest tests.test_deployment_smoke
